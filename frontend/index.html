<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#071a20" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f8f9" media="(prefers-color-scheme: light)" />
    <title>Weather-Aware Truck Routing · Spotter</title>
    <meta name="description" content="Compare truck routes by forecast weather risk, load weight and travel time." />
    <meta property="og:title" content="Weather-Aware Truck Routing · Spotter" />
    <meta property="og:description" content="Compare truck routes by forecast weather risk, load weight and travel time." />
    <script>
      // apply the theme before first paint to avoid a light/dark flash; mirrors src/lib/theme.ts
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (theme !== "dark" && theme !== "light") {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
